<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verify your email · Fixibl</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#F3EDDF;--paper:#FCFAF3;--ink:#26323C;--muted:#7A7567;--line:#E3DAC6;
  --navy:#1E3A52;--orange:#E07D2B;--green:#4E8D5B;--danger:#B23A26;
  --font-display:'Bricolage Grotesque',sans-serif;--font-ui:'Hanken Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-ui);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
  background-color:var(--kraft);
  background-image:
    radial-gradient(circle at 6% 4%,rgba(224,125,43,.20),transparent 30%),
    radial-gradient(circle at 94% 3%,rgba(46,110,158,.18),transparent 32%),
    radial-gradient(circle at 90% 97%,rgba(78,141,91,.20),transparent 34%),
    radial-gradient(circle at 3% 94%,rgba(207,148,18,.18),transparent 30%),
    radial-gradient(rgba(38,50,60,.06) 1.4px,transparent 1.4px);
  background-size:auto,auto,auto,auto,22px 22px;
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat;
  -webkit-font-smoothing:antialiased;
}
.card{
  background:var(--paper);border:1.5px solid var(--line);border-radius:22px;
  padding:36px 30px;width:100%;max-width:440px;text-align:center;
  box-shadow:0 24px 60px -24px rgba(38,50,60,.5);
}
.logo{width:56px;height:56px;object-fit:contain;border-radius:14px;margin:0 auto 16px;display:block}
.logo-fallback{width:56px;height:56px;margin:0 auto 16px;display:none}
h1{font-family:var(--font-display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px}
p{color:var(--muted);font-size:.98rem;line-height:1.55;margin-bottom:6px}
.icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:4px auto 14px;color:#fff}
.icon.ok{background:var(--green);box-shadow:0 8px 22px -8px rgba(78,141,91,.6)}
.icon.bad{background:var(--danger);box-shadow:0 8px 22px -8px rgba(178,58,38,.55)}
.spinner{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:6px auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-display);font-weight:700;font-size:1rem;
  text-decoration:none;cursor:pointer;border:none;
  background:var(--navy);color:#fff;padding:13px 22px;border-radius:11px;margin-top:18px;
  box-shadow:0 9px 20px -8px rgba(30,58,82,.65);transition:.16s;
}
.btn:hover{background:#16293b;transform:translateY(-1px)}
.hidden{display:none}
.brand{margin-top:20px;font-size:.78rem;color:var(--muted)}
.brand b{color:var(--ink);font-family:var(--font-display);font-weight:800}
</style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="Fixibl" class="logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <svg viewBox="0 0 48 48" class="logo-fallback" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="44" height="44" rx="12" fill="#1E3A52"></rect><polygon points="24,13 32.7,18 32.7,28 24,33 15.3,28 15.3,18" fill="none" stroke="#FCFAF3" stroke-width="3" stroke-linejoin="round"></polygon><circle cx="24" cy="23" r="4.3" fill="#FCFAF3"></circle><path d="M24 13c.1-3.6 2.7-6.2 6.4-6.5-.1 3.7-2.7 6.3-6.4 6.5z" fill="#6BBE85"></path><circle cx="33" cy="9.6" r="1.7" fill="#E07D2B"></circle></svg>

    <!-- Loading -->
    <div id="state-loading">
      <div class="spinner"></div>
      <h1>Verifying your email…</h1>
      <p>Hang tight, this only takes a second.</p>
    </div>

    <!-- Success -->
    <div id="state-success" class="hidden">
      <div class="icon ok">✓</div>
      <h1>Email verified!</h1>
      <p>You're all set. Head back to Fixibl and sign in.</p>
      <a class="btn" id="success-cta" href="https://www.fixibl.com">Go to Fixibl →</a>
    </div>

    <!-- Error -->
    <div id="state-error" class="hidden">
      <div class="icon bad">!</div>
      <h1 id="error-title">Something went wrong</h1>
      <p id="error-msg">We couldn't verify your email.</p>
      <a class="btn" href="https://www.fixibl.com">Back to Fixibl</a>
    </div>

    <div class="brand"><b>Fixibl</b> · Anything is Fixibl</div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, applyActionCode } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Same Firebase project as the site and app.
const firebaseConfig = {
  apiKey: "AIzaSyAwFpDNSHGWQYoXbe4UWBNggFYCHJ-K-4Q",
  authDomain: "fixify-1.firebaseapp.com",
  projectId: "fixify-1",
  storageBucket: "fixify-1.firebasestorage.app",
  messagingSenderId: "397001927220",
  appId: "1:397001927220:web:0c24702fa77fc6a1a53861",
  measurementId: "G-0FXM4FHKH4"
};
const auth = getAuth(initializeApp(firebaseConfig));

const params  = new URLSearchParams(location.search);
const mode    = params.get('mode');
const oobCode = params.get('oobCode');
const cont    = params.get('continueUrl');

function show(id){
  ['state-loading','state-success','state-error'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}
function fail(title, msg){
  document.getElementById('error-title').textContent = title;
  document.getElementById('error-msg').textContent = msg;
  show('state-error');
}

async function run(){
  if(!oobCode){
    fail('Invalid link', 'This link is missing its verification code. Please open the most recent link from your email.');
    return;
  }
  // Firebase points all email actions at this URL. We handle email verification;
  // these modes are all confirmed with applyActionCode.
  if(mode && !['verifyEmail','recoverEmail','verifyAndChangeEmail'].includes(mode)){
    fail("Can't handle this link here", 'This link isn’t an email-verification link. If you were resetting a password, use the link from that email instead.');
    return;
  }
  try{
    await applyActionCode(auth, oobCode);
    document.getElementById('success-cta').href = cont || 'https://www.fixibl.com';
    show('state-success');
  }catch(e){
    const code = (e && e.code) || '';
    if(code.includes('expired-action-code')){
      fail('Link expired', 'This verification link has expired. Sign in to Fixibl and we’ll send you a fresh one.');
    }else if(code.includes('invalid-action-code')){
      fail('Link already used', 'This link is invalid or has already been used. If your email is already verified, just sign in.');
    }else if(code.includes('user-disabled')){
      fail('Account disabled', 'This account has been disabled. Contact support@fixibl.com if you think this is a mistake.');
    }else if(code.includes('user-not-found')){
      fail('Account not found', 'We couldn’t find this account. It may have been removed.');
    }else{
      fail('Something went wrong', 'We couldn’t verify your email. Please try the link again, or sign in to request a new one.');
    }
  }
}
run();
</script>
</body></html>
